<?xml version="1.0" encoding="UTF-8"?>
<!-- SDLInvaders' GlowIcon art: an invader over a night city, a fighter's
     shot rising to meet it. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a33"/>
      <stop offset="1" stop-color="#2a1a66"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#sky)" stroke="#05051a" stroke-width="3"/>
  <g fill="#ffffcc">
    <circle cx="20" cy="20" r="1.5"/><circle cx="104" cy="16" r="1.5"/><circle cx="96" cy="44" r="1.2"/>
    <circle cx="16" cy="56" r="1.2"/><circle cx="112" cy="66" r="1.5"/><circle cx="34" cy="40" r="1"/>
  </g>
  <!-- the invader, in pixels of 6 -->
  <g fill="#44ee44" stroke="#116611" stroke-width="1">
    <rect x="40" y="16" width="6" height="6"/><rect x="82" y="16" width="6" height="6"/>
    <rect x="46" y="22" width="6" height="6"/><rect x="76" y="22" width="6" height="6"/>
    <rect x="40" y="28" width="48" height="6"/>
    <rect x="34" y="34" width="12" height="6"/><rect x="52" y="34" width="24" height="6"/><rect x="82" y="34" width="12" height="6"/>
    <rect x="28" y="40" width="72" height="6"/>
    <rect x="28" y="46" width="6" height="6"/><rect x="40" y="46" width="48" height="6"/><rect x="94" y="46" width="6" height="6"/>
    <rect x="28" y="52" width="6" height="6"/><rect x="40" y="52" width="6" height="6"/><rect x="82" y="52" width="6" height="6"/><rect x="94" y="52" width="6" height="6"/>
    <rect x="52" y="58" width="9" height="6"/><rect x="67" y="58" width="9" height="6"/>
  </g>
  <!-- the shot -->
  <rect x="62" y="70" width="4" height="12" rx="2" fill="#ffee55"/>
  <!-- the city -->
  <g fill="#14143a" stroke="#05051a" stroke-width="1">
    <rect x="8" y="96" width="16" height="24"/><rect x="24" y="86" width="14" height="34"/>
    <rect x="38" y="100" width="12" height="20"/><rect x="76" y="92" width="14" height="28"/>
    <rect x="90" y="82" width="14" height="38"/><rect x="104" y="98" width="16" height="22"/>
  </g>
  <g fill="#ffcc33">
    <rect x="28" y="92" width="3" height="3"/><rect x="33" y="100" width="3" height="3"/><rect x="28" y="108" width="3" height="3"/>
    <rect x="94" y="88" width="3" height="3"/><rect x="99" y="96" width="3" height="3"/><rect x="94" y="104" width="3" height="3"/>
    <rect x="12" y="102" width="3" height="3"/><rect x="80" y="98" width="3" height="3"/><rect x="109" y="104" width="3" height="3"/>
  </g>
  <!-- the fighter -->
  <g fill="#dddddd" stroke="#444444" stroke-width="1.2">
    <path d="M64 86 L72 104 L80 106 L80 112 L48 112 L48 106 L56 104 Z"/>
  </g>
  <rect x="61" y="92" width="6" height="6" fill="#55aaff"/>
</svg>
